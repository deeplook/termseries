repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Local hooks call the project's pinned ruff/mypy via uv, so the commit-time
  # checks match CI exactly (no bundled-tool version drift, and mypy sees the
  # project's real dependencies rather than an isolated stub-less venv).
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, auto-fix)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]
