[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termseries"
version = "0.1.0"
description = "Show timeseries data in the terminal using matplotlib."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib",
    "pillow>=12.1.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "textual>=7.5.0",
    "textual-image",
    "typer>=0.21.1",
]

[project.scripts]
termseries = "termseries.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=4.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "types-requests>=2.31",
]
docs = [
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/deeplook/termseries"
Repository = "https://github.com/deeplook/termseries"
Documentation = "https://github.com/deeplook/termseries#readme"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# tui.py uses # type: ignore comments that are only active in some environments
# (e.g. when textual stubs are absent in the pre-commit hook's isolated venv).
# Disabling warn_unused_ignores here avoids false "unused ignore" warnings.
module = "termseries.tui"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
