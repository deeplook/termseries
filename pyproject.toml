[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/",
    ".github/",
    ".pre-commit-config.yaml",
    "attic/",
    "demo/",
    "demo.cast",
    "demo.yaml",
    "demo-rec-script.sh",
    "docs/",
    "examples/",
    "gen_asciicast.py",
    "htmlcov/",
    "openspec/",
    "output/",
    "tests/",
    "termseries_*.png",
    "NOTES.md",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/termseries"]

[project]
name = "termseries"
version = "0.1.0"
description = "Show timeseries data in the terminal using matplotlib."
readme = "README.md"
authors = [{ name = "Dinu Gherman", email = "gherman@darwin.in-berlin.de" }]
license = {text = "MIT"}
keywords = ["terminal", "timeseries", "chart", "matplotlib", "cli"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib",
    "pillow>=12.1.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "textual>=7.5.0",
    "textual-image",
    "typer>=0.21.1",
]

[project.scripts]
termseries = "termseries.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=4.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "types-requests>=2.31",
]
docs = [
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/deeplook/termseries"
Repository = "https://github.com/deeplook/termseries"
Documentation = "https://github.com/deeplook/termseries#readme"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# cli.py and tui.py carry # type: ignore comments that are only active in some
# environments: cli.py's `@app.command()` typer decorators report untyped-decorator
# (misc) errors only when typer's inline types aren't visible, and tui.py's ignores
# depend on whether textual stubs are present (e.g. in the pre-commit hook's isolated
# venv). Disabling warn_unused_ignores here avoids false "unused ignore" warnings while
# keeping the ignores in place for the environments that need them.
module = ["termseries.cli", "termseries.tui"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not docker'"
asyncio_mode = "auto"
markers = ["docker: tests that require Docker and image pull access"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
